# Shared base configuration for all environments.
# Not used directly — always compose with an environment override file:
#   docker-compose -f docker-compose.base.yml -f docker-compose.yml up
#   docker-compose -f docker-compose.base.yml -f docker-compose.staging.yml up

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --replicaof redis 6379
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    depends_on:
      - redis

  redis-sentinel-1:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis 6379 2
      --sentinel down-after-milliseconds mymaster 5000
      --sentinel failover-timeout mymaster 60000
      --sentinel parallel-syncs mymaster 1
    depends_on:
      - redis

  redis-sentinel-2:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis 6379 2
      --sentinel down-after-milliseconds mymaster 5000
      --sentinel failover-timeout mymaster 60000
      --sentinel parallel-syncs mymaster 1
    depends_on:
      - redis

  redis-sentinel-3:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-sentinel
      --sentinel monitor mymaster redis 6379 2
      --sentinel down-after-milliseconds mymaster 5000
      --sentinel failover-timeout mymaster 60000
      --sentinel parallel-syncs mymaster 1
    depends_on:
      - redis

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_APP_NAME=Lumigift
      - NODE_ENV=production
      - REDIS_USE_SENTINEL=true
      - REDIS_SENTINEL_HOSTS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_NAME=mymaster
      - USDC_ASSET_CODE=USDC
      - GIFT_MIN_AMOUNT_NGN=${GIFT_MIN_AMOUNT_NGN:-500}
      - GIFT_MAX_AMOUNT_NGN=${GIFT_MAX_AMOUNT_NGN:-500000}
      - GIFT_DAILY_LIMIT_NGN=${GIFT_DAILY_LIMIT_NGN:-1000000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
      redis-sentinel-2:
        condition: service_started
      redis-sentinel-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
